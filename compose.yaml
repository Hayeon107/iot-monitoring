
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: iot-rabbitmq
    ports:
      - "5672:5672" #python 프로그램의 rabbitmq연결
      - "15672:15672" # rabbitmq 관리 웹 화면
    environment:
      RABBITMQ_DEFAULT_USER: iotuser
      RABBITMQ_DEFAULT_PASS: iotpass123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: iot-mariadb
    ports:
      - "3306:3306" # Python 프로그램의 MariaDB 연결
    environment:
      MARIADB_DATABASE: iotdb
      MARIADB_USER: iotuser
      MARIADB_PASSWORD: iotpass123
      MARIADB_ROOT_PASSWORD: rootpass123
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped

volumes:
  rabbitmq_data:
  mariadb_data:
